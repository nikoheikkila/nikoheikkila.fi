<svg aria-labelledby="t d" font-family="'Segoe Print','Comic Sans MS',-apple-system,Helvetica,Arial,sans-serif" height="460" role="img" viewBox="0 0 1370 460" width="1370" xmlns="http://www.w3.org/2000/svg" >
  <title id="t">CI pipeline flow</title>
  <desc id="d">A push to main or a pull request first installs dependencies once and shares them as an artifact; unit, component and mutation tests plus a build then run in parallel. The build feeds acceptance tests on three browsers. When all pass, pull requests deploy a preview followed by a Lighthouse audit, and pushes to main deploy production followed by a Lighthouse audit.</desc>
  <defs>
    <marker id="a" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10" >
      <path d="M0 0L10 5L0 10z" fill="#495057"/>
    </marker>
  </defs>
  <rect fill="#ffffff" height="460" rx="12" width="1370" />
  <text fill="#212529" font-size="22" font-weight="bold" text-anchor="middle" x="685" y="32" >CI Workflow (.github/workflows/ci.yml)</text>

  <!-- arrows -->
  <g fill="none" marker-end="url(#a)" stroke="#495057" stroke-width="2" >
    <path d="M160 260 L190 260"/>
    <path d="M330 260 L390 100"/>
    <path d="M330 260 L390 190"/>
    <path d="M330 260 L390 280"/>
    <path d="M330 260 L390 390"/>
    <path d="M570 100 L860 100"/>
    <path d="M570 190 L860 190"/>
    <path d="M570 280 L860 280"/>
    <path d="M570 390 L620 390"/>
    <path d="M820 390 L860 390"/>
    <path d="M880 150 L920 150"/>
    <path d="M880 350 L920 350"/>
    <path d="M1120 150 L1170 150"/>
    <path d="M1120 350 L1170 350"/>
  </g>

  <!-- trigger -->
  <rect fill="#ffd43b" height="90" rx="10" stroke="#495057" stroke-width="2" width="140" x="20" y="215" />
  <text fill="#212529" font-size="16" font-weight="bold" text-anchor="middle" x="90" y="245" >Trigger</text>
  <text fill="#212529" font-size="13" text-anchor="middle" x="90" y="267" >push to main</text>
  <text fill="#212529" font-size="13" text-anchor="middle" x="90" y="285" >pull request</text>

  <!-- install -->
  <rect fill="#a5d8ff" height="70" rx="10" stroke="#495057" stroke-width="2" width="140" x="190" y="225" />
  <text fill="#212529" font-size="16" font-weight="bold" text-anchor="middle" x="260" y="255" >Install</text>
  <text fill="#495057" font-size="12" text-anchor="middle" x="260" y="275" >node_modules artifact</text>

  <!-- parallel jobs -->
  <g fill="#a5d8ff" stroke="#495057" stroke-width="2">
    <rect height="70" rx="10" width="180" x="390" y="65" />
    <rect height="70" rx="10" width="180" x="390" y="155" />
    <rect height="70" rx="10" width="180" x="390" y="245" />
    <rect height="70" rx="10" width="180" x="390" y="355" />
  </g>
  <g fill="#212529" font-size="16" font-weight="bold" text-anchor="middle" >
    <text x="480" y="95">Unit Tests</text>
    <text x="480" y="185">Component Tests</text>
    <text x="480" y="275">Mutation Tests</text>
    <text x="480" y="385">Build</text>
  </g>
  <g fill="#495057" font-size="12" text-anchor="middle" >
    <text x="480" y="115">+ lint style</text>
    <text x="480" y="205">Vitest</text>
    <text x="480" y="295">Stryker</text>
    <text x="480" y="405">site + type-check</text>
  </g>

  <!-- acceptance -->
  <rect fill="#a5d8ff" height="70" rx="10" stroke="#495057" stroke-width="2" width="200" x="620" y="355" />
  <text fill="#212529" font-size="16" font-weight="bold" text-anchor="middle" x="720" y="385" >Acceptance Tests</text>
  <text fill="#495057" font-size="12" text-anchor="middle" x="720" y="405" >chromium · firefox · webkit</text>

  <!-- join gate -->
  <rect fill="#868e96" height="360" rx="6" stroke="#495057" stroke-width="2" width="20" x="860" y="65" />
  <text fill="#495057" font-size="12" text-anchor="middle" x="870" y="450" >all green</text>

  <!-- deploys -->
  <rect fill="#b2f2bb" height="70" rx="10" stroke="#495057" stroke-width="2" width="200" x="920" y="115" />
  <text fill="#212529" font-size="16" font-weight="bold" text-anchor="middle" x="1020" y="145" >Deploy to Preview</text>
  <text fill="#495057" font-size="12" text-anchor="middle" x="1020" y="165" >pull requests only</text>

  <rect fill="#b2f2bb" height="70" rx="10" stroke="#495057" stroke-width="2" width="200" x="920" y="315" />
  <text fill="#212529" font-size="16" font-weight="bold" text-anchor="middle" x="1020" y="345" >Deploy to Production</text>
  <text fill="#495057" font-size="12" text-anchor="middle" x="1020" y="365" >push to main only</text>

  <!-- lighthouse -->
  <rect fill="#d0bfff" height="70" rx="10" stroke="#495057" stroke-width="2" width="180" x="1170" y="115" />
  <text fill="#212529" font-size="16" font-weight="bold" text-anchor="middle" x="1260" y="145" >Lighthouse</text>
  <text fill="#495057" font-size="12" text-anchor="middle" x="1260" y="165" >audit preview</text>

  <rect fill="#d0bfff" height="70" rx="10" stroke="#495057" stroke-width="2" width="180" x="1170" y="315" />
  <text fill="#212529" font-size="16" font-weight="bold" text-anchor="middle" x="1260" y="345" >Lighthouse</text>
  <text fill="#495057" font-size="12" text-anchor="middle" x="1260" y="365" >audit production</text>
</svg>
