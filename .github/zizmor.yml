# Zizmor configuration. Every ignore documents why the finding is accepted.
# https://docs.zizmor.sh/configuration/
rules:
  # renovate-autofix.yml runs main's code on same-repository Renovate heads; claude.yml needs a non-bot `@claude`.
  dangerous-triggers:
    ignore:
      - renovate-autofix.yml
      - claude.yml

  # CLAUDE_CODE_OAUTH_TOKEN is a repository secret: an environment's branch gate would block these arbitrary-ref runs.
  secrets-outside-env:
    ignore:
      - claude.yml
      - renovate-autofix.yml
