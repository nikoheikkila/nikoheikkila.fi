name: Deploy site with Terraform
description: Deploys or destroys a static site environment on Cloudflare Workers and R2 using Terraform (previews add a Wrangler version upload)

inputs:
  cloudflare-api-token:
    description: CloudFlare API token used by the Terraform provider
    required: true
  r2-access-key-id:
    description: R2 access key ID for the state backend and object uploads
    required: true
  r2-secret-access-key:
    description: R2 secret access key for the state backend and object uploads
    required: true
  workspace:
    description: Terraform workspace to target (default = production, pr-<n> = preview)
    required: false
    default: default
  operation:
    description: Terraform operation to run (deploy or destroy)
    required: false
    default: deploy
  dist-dir:
    description: Build output to upload, relative to infra/site or absolute
    required: false
    default: ../../public
  worker-dir:
    description: >-
      Preview deploys only — directory holding the bundled worker.js to upload as a
      version of the preview Worker. Requires installed dependencies (wrangler).
    required: false
    default: ""

outputs:
  url:
    description: The URL of the deployment (deploy operation only)
    value: ${{ steps.output.outputs.url }}

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: v1.17.1
        terraform_wrapper: false

    - name: Cache Terraform providers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.terraform.d/plugin-cache
        key: ${{ runner.os }}-terraform-providers-${{ hashFiles('infra/site/.terraform.lock.hcl') }}

    - name: Enable Terraform provider cache
      shell: bash
      run: |
        mkdir -p ~/.terraform.d/plugin-cache
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: latest

    - name: Install Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2

    - name: Run Terraform
      shell: bash
      working-directory: infra/site
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        AWS_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        WORKSPACE: ${{ inputs.workspace }}
        DIST_DIR: ${{ inputs.dist-dir }}
      run: task "ci:${{ inputs.operation }}" WORKSPACE="$WORKSPACE" DIST_DIR="$DIST_DIR"

    - name: Upload preview version
      if: ${{ inputs.operation == 'deploy' && inputs.workspace != 'default' }}
      shell: bash
      working-directory: infra/site
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        AWS_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        WORKSPACE: ${{ inputs.workspace }}
        WORKER_DIR: ${{ inputs.worker-dir }}
      run: task ci:preview:upload WORKSPACE="$WORKSPACE" WORKER_DIR="$WORKER_DIR"

    - name: Read deployment URL
      if: ${{ inputs.operation == 'deploy' }}
      id: output
      shell: bash
      working-directory: infra/site
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
      run: echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"
