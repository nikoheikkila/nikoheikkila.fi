name: Setup Development Environment
description: Installs the toolchain pinned in mise.toml with Mise

runs:
  using: composite
  steps:
    - name: Install tools with Mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.11.8
        # `workflow_run` jobs share main's cache scope and may handle pull request content, so they only read the cache.
        cache_save: ${{ github.event_name != 'workflow_run' }}
