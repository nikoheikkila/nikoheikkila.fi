name: Terraform deploy
description: >-
  Applies a Terraform root module from a saved plan artifact. Requires terraform on PATH. Provider and backend
  credentials are read from the environment of the calling step.

inputs:
  working-directory:
    description: Root module directory
    required: true
  parallelism:
    description: Number of concurrent resource operations
    default: "10"
  plan-artifact:
    description: Artifact name of the saved plan to apply
    required: true
  plan-file:
    description: File name of the saved plan, relative to the working directory
    default: tfplan
  lock-timeout:
    description: How long to wait for a state lock held by another run, e.g. a local apply
    default: 5m

runs:
  using: composite
  steps:
    - name: Download plan
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.plan-artifact }}
        path: ${{ inputs.working-directory }}

    - name: Initialize
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false

    - name: Apply
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PARALLELISM: ${{ inputs.parallelism }}
        PLAN_FILE: ${{ inputs.plan-file }}
        LOCK_TIMEOUT: ${{ inputs.lock-timeout }}
      run: |
        # A saved plan carries its variables.
        if ! terraform apply -input=false -lock-timeout="$LOCK_TIMEOUT" -parallelism="$PARALLELISM" "$PLAN_FILE"; then
          echo "::error::Applying the saved plan failed. If the state changed after planning, the plan is stale: re-run all jobs to plan again."
          exit 1
        fi
