name: Install Dependencies
description: Restores the Bun install cache and installs dependencies

inputs:
  save-cache:
    description: Set to `true` to save cache
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore node_modules
      id: bun-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: task install

    - name: Save node_modules
      if: inputs.save-cache == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
