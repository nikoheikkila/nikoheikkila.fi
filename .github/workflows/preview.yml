name: Preview

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Pull Request
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read # Required to call the API for commit metadata
      pull-requests: read # Required to resolve the pull request of the CI run
    outputs:
      number: ${{ steps.pr.outputs.number }}

    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          numbers=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" --jq \
            "[.[] | select(.state == \"open\" and .head.sha == \"$HEAD_SHA\" and (.head.repo.full_name | ascii_downcase) == (\"$HEAD_REPOSITORY\" | ascii_downcase)) | .number]")
          if [ "$(jq 'length' <<< "$numbers")" != "1" ]; then
            echo "::notice::Skipping: no unique open pull request for $HEAD_SHA ($numbers)."
            exit 0
          fi
          number=$(jq '.[0]' <<< "$numbers")
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::Unexpected pull request number: $number"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Preview
    needs: [resolve]
    if: needs.resolve.outputs.number != ''
    concurrency:
      group: deploy-preview-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read # Required to check out the repository
      actions: read # Required to download artifacts of the CI run
    uses: $/.github/workflows/terraform.yml
    with:
      module: site
      operation: deploy
      environment: preview
      workspace: pr-${{ needs.resolve.outputs.number }}
      artifacts-run-id: ${{ github.event.workflow_run.id }}
    # Environment secrets must be passed by name; the called job's
    # `environment` then supplies their values.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_SECRET: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}

  lighthouse:
    name: Lighthouse Audit for Preview
    runs-on: ubuntu-latest
    needs: [deploy]
    env:
      LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Run Audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ needs.deploy.outputs.url }}
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true

  report:
    name: Report Preview Deployment
    runs-on: ubuntu-latest
    needs: [resolve, deploy]
    if: always() && github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: preview-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read # Required to check out the repository
      actions: read # Required to read the CI and deployment run status
      pull-requests: write # Required to update the sticky preview comment

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Report preview deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
        run: task ci:report
