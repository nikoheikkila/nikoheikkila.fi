name: Pull Request Closed

# Runs pull request code, so it holds no permissions and no secrets. It only
# signals `preview-cleanup.yml`, which reacts via `workflow_run` from main.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  signal:
    name: Signal Preview Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Signal
        run: echo "Pull request closed; Preview Cleanup takes over."
