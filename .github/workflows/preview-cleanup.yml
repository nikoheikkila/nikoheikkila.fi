name: Preview Cleanup

# `workflow_run` runs this file from main. The PR number comes from the GitHub
# API for the closed run's head commit, never from the triggering workflow.
# A manual run cleans up a closed PR by number; the `preview` environment
# admits only runs from main.
on:
  workflow_run:
    workflows: ["Pull Request Closed"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Number of the closed pull request whose preview to destroy
        required: true
        type: number

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: preview-cleanup-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Pull Request
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' }}
    permissions:
      contents: read # Required to call the API for commit metadata
      pull-requests: read # Required to resolve the closed pull request
    outputs:
      number: ${{ steps.pr.outputs.number || steps.requested.outputs.number }}

    steps:
      - name: Check requested pull request
        id: requested
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ inputs.pull-request }}
        run: |
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Unexpected pull request number: $NUMBER"; exit 1; }
          state=$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq .state)
          if [ "$state" != closed ]; then
            echo "::error::Pull request #$NUMBER is $state; only closed pull requests are cleaned up."
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Resolve pull request
        id: pr
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          # Look up by head branch: `commits/{sha}/pulls` omits pull requests closed without merging.
          number=$(gh api --method GET "repos/$REPOSITORY/pulls" \
            -f state=closed -f base=main -f head="${HEAD_REPOSITORY%%/*}:$HEAD_BRANCH" \
            -f sort=updated -f direction=desc -f per_page=100 \
            --jq "[.[] | select(.head.sha == \"$HEAD_SHA\" and ((.head.repo.full_name // \"\") | ascii_downcase) == (\"$HEAD_REPOSITORY\" | ascii_downcase))] | max_by(.closed_at) | .number // empty")
          if [ -z "$number" ]; then
            echo "::notice::Skipping: no closed pull request for $HEAD_SHA."
            exit 0
          fi
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::Unexpected pull request number: $number"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"

  destroy:
    name: Destroy Preview Deployment
    needs: [resolve]
    # Fork PRs never get a preview, so there is nothing to destroy. A manual run for one finds no workspace.
    if: >-
      ${{ needs.resolve.outputs.number != '' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    concurrency:
      group: deploy-preview-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: preview
    env:
      # R2 does not implement the AWS flexible checksum extensions.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      # Checks out main; the closed pull request's code never runs here.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Build Worker
        run: task site:build

      # Delete the Preview before its bucket, the reverse of the deploy order.
      # The bucket is destroyed even if this fails; a re-run or manual dispatch
      # retries whatever is left.
      - name: Delete Workers Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKSPACE: pr-${{ needs.resolve.outputs.number }}
        run: task site:ci:preview:delete WORKSPACE="$WORKSPACE"

      - name: Destroy preview
        if: ${{ !cancelled() }}
        uses: $/.github/actions/terraform/destroy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
          TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        with:
          working-directory: infra/site
          workspace: pr-${{ needs.resolve.outputs.number }}
          parallelism: 30

  purge-caches:
    name: Purge PR Caches
    needs: [resolve]
    if: ${{ needs.resolve.outputs.number != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write # Required to delete the pull request's caches

    steps:
      - name: Delete caches scoped to this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        run: |
          gh cache delete --all \
            --ref "refs/pull/$PR_NUMBER/merge" \
            --succeed-on-no-caches
