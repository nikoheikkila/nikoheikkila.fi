name: Preview Cleanup

# `pull_request_target` runs this file from the default branch, so the job that
# holds the preview token only ever executes trusted code. Never check out the
# PR head here. The `preview` environment only admits `main`, which is the ref
# `pull_request_target` runs on.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy Preview Deployment
    runs-on: ubuntu-latest
    # Fork PRs never get a preview, so there is nothing to destroy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Destroy preview
        uses: ./.github/actions/terraform-site
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
          workspace: pr-${{ github.event.pull_request.number }}
          operation: destroy

  purge-caches:
    name: Purge PR Caches
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete caches scoped to this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh cache delete --all \
            --ref "refs/pull/$PR_NUMBER/merge" \
            --succeed-on-no-caches
