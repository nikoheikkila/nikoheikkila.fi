name: Preview Cleanup

# Deletes the Workers Preview of a closed or merged pull request and purges its caches.
# Fork and Dependabot pull requests never get a preview. `closed` never fires for a
# pull request with merge conflicts, so a manual run deletes the preview of a closed one.
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Number of the closed pull request whose preview to delete
        required: true
        type: number

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number || inputs.pull-request }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy Preview Deployment
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]') }}
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number || inputs.pull-request }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
      pull-requests: read # Required to check that a manually requested pull request is closed
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}

    steps:
      - name: Check requested pull request is closed
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" = OPEN ]; then
            echo "::error::Pull request #$PR_NUMBER is still open; only closed pull requests are cleaned up."
            exit 1
          fi

      # Deleting a missing Preview fails: pull requests that never deployed have none.
      # Cloudflare answers 10025 for a missing Preview; any other error fails the job.
      - name: Check for Workers Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_WORKER_NAME: ${{ vars.PREVIEW_WORKER_NAME }}
        run: |
          response=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$PREVIEW_WORKER_NAME/previews/pr-$PR_NUMBER")
          if jq -e '.success' <<< "$response" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif jq -e 'any(.errors[]?; .code == 10025)' <<< "$response" > /dev/null; then
            echo "::notice::No Workers Preview pr-$PR_NUMBER to delete."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Checking Workers Preview pr-$PR_NUMBER failed: $response"
            exit 1
          fi

      - name: Delete Workers Preview
        if: ${{ steps.preview.outputs.exists == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # No checkout or mise here, so the action installs Wrangler itself. Keep in step with mise.toml.
          # renovate: datasource=npm depName=wrangler
          wranglerVersion: "4.156.0"
          command: >-
            preview delete --worker-name ${{ vars.PREVIEW_WORKER_NAME }}
            --name pr-${{ env.PR_NUMBER }} --skip-confirmation

  purge-caches:
    name: Purge PR Caches
    # Fork pull requests only get a read-only token.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write # Required to delete the pull request's caches

    steps:
      - name: Delete caches scoped to this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh cache delete --all \
            --ref "refs/pull/$PR_NUMBER/merge" \
            --succeed-on-no-caches
