name: Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy Preview Deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/terraform.yml
    with:
      module: site
      operation: destroy
      environment: preview
      workspace: pr-${{ github.event.pull_request.number }}

  purge-caches:
    name: Purge PR Caches
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete caches scoped to this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh cache delete --all \
            --ref "refs/pull/$PR_NUMBER/merge" \
            --succeed-on-no-caches
