name: Preview Cleanup

# `workflow_run` runs this file from main. The PR number comes from the GitHub
# API for the closed run's head commit, never from the triggering workflow.
on:
  workflow_run:
    workflows: ["Pull Request Closed"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: preview-cleanup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Pull Request
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read # Required to call the API for commit metadata
      pull-requests: read # Required to resolve the closed pull request
    outputs:
      number: ${{ steps.pr.outputs.number }}

    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          numbers=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" --jq \
            "[.[] | select(.state == \"closed\" and .head.sha == \"$HEAD_SHA\" and (.head.repo.full_name | ascii_downcase) == (\"$HEAD_REPOSITORY\" | ascii_downcase)) | .number]")
          if [ "$(jq 'length' <<< "$numbers")" != "1" ]; then
            echo "::notice::Skipping: no unique closed pull request for $HEAD_SHA ($numbers)."
            exit 0
          fi
          number=$(jq '.[0]' <<< "$numbers")
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::Unexpected pull request number: $number"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"

  destroy:
    name: Destroy Preview Deployment
    needs: [resolve]
    # Fork PRs never get a preview, so there is nothing to destroy.
    if: >-
      needs.resolve.outputs.number != '' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: deploy-preview-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    uses: $/.github/workflows/terraform.yml
    with:
      module: site
      operation: destroy
      environment: preview
      workspace: pr-${{ needs.resolve.outputs.number }}
    # Environment secrets must be passed by name; the called job's
    # `environment` then supplies their values.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_SECRET: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}

  purge-caches:
    name: Purge PR Caches
    needs: [resolve]
    if: needs.resolve.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write # Required to delete the pull request's caches

    steps:
      - name: Delete caches scoped to this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        run: |
          gh cache delete --all \
            --ref "refs/pull/$PR_NUMBER/merge" \
            --succeed-on-no-caches
