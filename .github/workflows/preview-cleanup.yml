name: Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy Preview Deployment
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Destroy preview
        uses: ./.github/actions/terraform-site
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
          workspace: pr-${{ github.event.pull_request.number }}
          operation: destroy

  purge-caches:
    name: Purge PR Caches
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete caches scoped to this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache delete --all \
            --ref "refs/pull/${{ github.event.pull_request.number }}/merge" \
            --succeed-on-no-caches
