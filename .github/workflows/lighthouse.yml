name: Lighthouse

# Audits a deployed site; ci.yml calls it after each preview and production deploy.
on:
  workflow_call:
    inputs:
      url:
        description: URL of the deployed site to audit
        required: true
        type: string
      hash:
        description: Commit SHA the deployed site was built from
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Run Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ inputs.hash }}

    steps:
      - name: Run Audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ inputs.url }}
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
