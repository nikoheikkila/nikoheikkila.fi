name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/cloudflare/**"
  push:
    branches:
      - main
    paths:
      - "infra/cloudflare/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    # Runs PR code on pull requests, so it only ever gets read-only credentials:
    # a read-only API token and an R2 key that can only read the state bucket.
    # Without write access to state the plan cannot take the lock. A plan made
    # without the lock is still safe to apply: if state changed in the meantime,
    # the apply rejects the saved plan as stale.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_READ_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_READ_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: v1.17.1

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('infra/cloudflare/.terraform.lock.hcl') }}

      - name: Enable Terraform provider cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2

      - name: Terraform Init
        run: task terraform:ci:init

      - name: Terraform Plan
        run: task terraform:ci:plan LOCK=false

      - name: Upload Plan to Summary
        working-directory: infra/cloudflare
        run: |
          {
            echo "## Terraform Plan"
            echo ""
            echo "\`\`\`terraform"
            cat plan.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tfplan
          path: infra/cloudflare/tfplan
          retention-days: 1

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref_name == 'main'
    # Write credentials live only in the `prod` environment, which admits `main` only.
    environment: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
      # A separate, broader token: `cloudflare_workers_custom_domain` only accepts
      # account-wide Workers Scripts Write. The site deploy keeps its `blog`-only token.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: v1.17.1

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('infra/cloudflare/.terraform.lock.hcl') }}

      - name: Enable Terraform provider cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2

      - name: Download Terraform Plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tfplan
          path: infra/cloudflare/

      - name: Terraform Init
        run: task terraform:ci:init

      - name: Run Terraform Deploy
        run: task terraform:ci:deploy
