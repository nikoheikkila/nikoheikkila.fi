name: Terraform

on:
  workflow_call:
    inputs:
      module:
        description: Root module under infra/ (cloudflare | site)
        type: string
        required: true
      operation:
        description: plan (cloudflare only) | deploy | destroy (site only)
        type: string
        required: true
      environment:
        description: GitHub environment holding the credentials (empty for plan)
        type: string
        default: ""
      workspace:
        description: Terraform workspace of infra/site (default = production, pr-<n> = preview)
        type: string
        default: default
      artifacts-run-id:
        description: Run to download the build artifacts from (empty = the calling run)
        type: string
        default: ""
    # Callers pass every secret by name, even environment-only ones: for `prod`
    # and `preview` the job's `environment` then supplies the values. A secret
    # that isn't passed silently resolves to an empty string.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_R2_ACCESS_KEY_ID:
        required: true
      CLOUDFLARE_R2_ACCESS_KEY_SECRET:
        required: true
      CLOUDFLARE_INFRA_API_TOKEN:
        required: false
    outputs:
      url:
        description: The deployed site's URL (site/deploy only)
        value: ${{ jobs.terraform.outputs.url }}

# Least privilege; callers may grant more (e.g. `actions: read` to download
# artifacts of another run), never less than this.
permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.output.outputs.url }}
    outputs:
      url: ${{ steps.output.outputs.url }}
    env:
      # `cloudflare_workers_custom_domain` only accepts account-wide Workers
      # Scripts Write, so deploying infra/cloudflare uses the broader `prod` token.
      # The read-only plan has no environment, so it falls back to the token its
      # caller passes; the site keeps its per-Worker token.
      CLOUDFLARE_API_TOKEN: ${{ inputs.module == 'cloudflare' && secrets.CLOUDFLARE_INFRA_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
      WORKSPACE: ${{ inputs.workspace }}
      TARGET: ${{ inputs.module }}/${{ inputs.operation }}

    steps:
      - name: Reject unsupported module and operation
        if: ${{ !contains(fromJSON('["cloudflare/plan", "cloudflare/deploy", "site/deploy", "site/destroy"]'), env.TARGET) }}
        run: |
          echo "::error::Unsupported module/operation: $TARGET"
          exit 1

      - name: Require credentials
        if: ${{ !env.CLOUDFLARE_API_TOKEN || !env.AWS_ACCESS_KEY_ID || !env.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "::error::Missing Cloudflare token or R2 keys for $TARGET: pass them from the caller by name."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.17.2
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-providers-${{ inputs.module }}-${{ hashFiles(format('infra/{0}/.terraform.lock.hcl', inputs.module)) }}

      - name: Enable Terraform provider cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Plan infrastructure
        if: env.TARGET == 'cloudflare/plan'
        run: |
          task terraform:ci:init
          task terraform:ci:plan LOCK=false

      - name: Publish plan to summary
        if: env.TARGET == 'cloudflare/plan'
        working-directory: infra/cloudflare
        run: |
          {
            echo "## Terraform Plan"
            echo ""
            echo "\`\`\`terraform"
            cat plan.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The binary plan holds sensitive values unmasked, and only the
      # cloudflare/deploy on main consumes it, so pull requests never publish it as an artifact.
      - name: Upload plan
        if: env.TARGET == 'cloudflare/plan' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tfplan
          path: infra/cloudflare/tfplan
          retention-days: 1

      - name: Download plan
        if: env.TARGET == 'cloudflare/deploy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: infra/cloudflare/

      - name: Deploy infrastructure
        if: env.TARGET == 'cloudflare/deploy'
        run: |
          task terraform:ci:init
          task terraform:ci:deploy

      - name: Download static assets
        if: env.TARGET == 'site/deploy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-assets
          path: ${{ runner.temp }}/site
          run-id: ${{ inputs.artifacts-run-id }}
          github-token: ${{ inputs.artifacts-run-id && github.token || '' }}

      - name: Deploy site
        if: env.TARGET == 'site/deploy'
        env:
          DIST_DIR: ${{ runner.temp }}/site
        run: task site:ci:deploy WORKSPACE="$WORKSPACE" DIST_DIR="$DIST_DIR"

      - name: Download preview Worker
        if: env.TARGET == 'site/deploy' && inputs.workspace != 'default'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-worker
          path: ${{ runner.temp }}/worker
          run-id: ${{ inputs.artifacts-run-id }}
          github-token: ${{ inputs.artifacts-run-id && github.token || '' }}

      - name: Install dependencies
        if: env.TARGET == 'site/deploy' && inputs.workspace != 'default'
        uses: $/.github/actions/install-dependencies

      - name: Upload preview version
        if: env.TARGET == 'site/deploy' && inputs.workspace != 'default'
        env:
          WORKER_DIR: ${{ runner.temp }}/worker
        run: task site:ci:preview:upload WORKSPACE="$WORKSPACE" WORKER_DIR="$WORKER_DIR"

      - name: Read deployment URL
        if: env.TARGET == 'site/deploy'
        id: output
        working-directory: infra/site
        run: echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"

      - name: Destroy site
        if: env.TARGET == 'site/destroy'
        run: task site:ci:destroy WORKSPACE="$WORKSPACE"
