name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CONTRIBUTING.md"
      - "AGENTS.md"
      - "README.md"
      - "CODE_OF_CONDUCT.md"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies
        with:
          save-cache: "true"

      - name: Lint Code Style
        run: task lint:style

      - name: Run unit tests
        run: task test:unit

  workflow_audit:
    name: Audit Workflows
    # Uploading SARIF needs `security-events: write`, which fork and Dependabot
    # pull requests never get.
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Required to check out the repository
      security-events: write # Required to upload SARIF results to Advanced Security

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: auditor
          config: .github/zizmor.yml
          advanced-security: true
          # renovate: datasource=github-tags depName=zizmorcore/zizmor
          version: 1.32.0

      - name: Run jactionlint
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          config-file: .github/actionlint.yml
          profile: pedantic
          online: true
          advanced-security: true

  component_tests:
    name: Component Tests (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies

      - name: Run component tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: task test:component args="--with-deps --only-shell $BROWSER" -- --browser="$BROWSER"

  mutation_tests:
    name: Mutation Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies

      - name: Run mutation tests
        run: task test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          retention-days: 7
          if-no-files-found: error
          path: reports/mutation/

  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies

      - name: Restore Gatsby build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public
          key: gatsby-public-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gatsby-public-${{ runner.os }}-

      - name: Build site
        id: build
        run: task build

      - name: Type-check
        run: task lint:types

      - name: Upload static assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-assets
          retention-days: 1
          if-no-files-found: error
          # Carries public/.assetsignore to the deploy, which Wrangler reads from the assets directory.
          include-hidden-files: true
          path: |
            public/
            !public/**/*.js.map
            !public/webpack.stats.json
            !public/chunk-map.json

      - name: Upload serve configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serve-configuration
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/compiled/
            .cache/match-paths.json

      - name: Save Gatsby build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public
          key: gatsby-public-${{ runner.os }}-${{ github.sha }}

  acceptance_tests:
    name: Acceptance Tests (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies

      - name: Download static assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-assets
          path: public

      - name: Download serve configuration
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: serve-configuration
          path: .cache

      - name: Run E2E Tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: task test:e2e args="--with-deps $BROWSER ffmpeg" -- --project="$BROWSER"

  terraform_plan:
    name: Terraform Plan
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      needs-apply: ${{ steps.terraform.outputs.needs-apply }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      # Read-only repository secrets: the plan runs for pull requests, which the
      # `prod` environment never admits.
      - name: Plan infrastructure
        id: terraform
        uses: $/.github/actions/terraform/plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }} # zizmor: ignore[secrets-outside-env]
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_READ_ACCESS_KEY_ID }} # zizmor: ignore[secrets-outside-env]
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_READ_SECRET }} # zizmor: ignore[secrets-outside-env]
          TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_preview_worker_name: ${{ vars.PREVIEW_WORKER_NAME }}
        with:
          working-directory: infra/cloudflare
          lock: "false"
          plan-artifact: ${{ github.event_name != 'pull_request' && 'tfplan' || '' }}

  deploy_preview:
    # The `Mainline` ruleset requires a check with this name; a skipped job passes it.
    name: Preview Deployment
    # Fork and Dependabot pull requests get no secrets, so they get no preview.
    if: >-
      ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    needs: [unit_tests, workflow_audit, component_tests, mutation_tests, acceptance_tests, terraform_plan]
    # Shared with preview-cleanup.yml, so a deploy and a delete of the same preview never overlap.
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ steps.preview.outputs.preview-url }}
    permissions:
      contents: read # Required to check out the repository
      actions: read # Required to download artifacts of this run
      pull-requests: read # Required to check that the pull request is still open
    outputs:
      url: ${{ steps.preview.outputs.preview-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # wrangler-action runs the mise-pinned Wrangler through bunx.
      - name: Setup environment
        uses: $/.github/actions/setup-environment
        with:
          tools: node bun npm:wrangler

      - name: Download static assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-assets
          path: public

      # A pull request closed while CI ran has already been cleaned up; deploying would bring its preview back.
      - name: Check pull request is open
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" = OPEN ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pull request #$PR_NUMBER is $state; skipping the preview."
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Workers Preview
        id: preview
        if: ${{ steps.pr.outputs.open == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            preview --config wrangler.jsonc --worker-name ${{ vars.PREVIEW_WORKER_NAME }}
            --name pr-${{ github.event.pull_request.number }}
            --message "Preview for pr-${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"
            --ignore-base-config

  lighthouse_preview:
    name: Lighthouse Audit for Preview
    needs: [deploy_preview]
    if: ${{ needs.deploy_preview.outputs.url != '' }}
    uses: $/.github/workflows/lighthouse.yml
    with:
      url: ${{ needs.deploy_preview.outputs.url }}
      hash: ${{ github.event.pull_request.head.sha }}

  deploy_infrastructure:
    name: Deploy Infrastructure
    if: >-
      ${{ github.event_name != 'pull_request' && github.ref_name == 'main' &&
      needs.terraform_plan.outputs.needs-apply == 'true' }}
    needs: [unit_tests, component_tests, mutation_tests, acceptance_tests, terraform_plan]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read # Required to check out the repository
      actions: read # Required to download artifacts of this run

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      # `cloudflare_workers_custom_domain` only accepts account-wide Workers
      # Scripts Write, so infra/cloudflare uses the broader infra token.
      - name: Deploy infrastructure
        uses: $/.github/actions/terraform/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
        with:
          working-directory: infra/cloudflare
          plan-artifact: tfplan
          emit-outputs: "false"

  deploy:
    name: Deploy to Production
    needs: [deploy_infrastructure]
    # Run even when the infrastructure deploy was skipped (no changes).
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' && github.ref_name == 'main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: prod
      url: https://${{ github.event.repository.name }}
    permissions:
      contents: read # Required to check out the repository
      actions: read # Required to download artifacts of this run

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment
        with:
          tools: node bun npm:wrangler

      - name: Download static assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-assets
          path: public

      # --config skips Wrangler's framework autoconfig.
      - name: Deploy site
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

  lighthouse:
    name: Lighthouse Audit for Production
    needs: [deploy]
    # The implicit success() fails when Deploy Infrastructure was skipped upstream.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    uses: $/.github/workflows/lighthouse.yml
    with:
      url: https://${{ github.event.repository.name }}
      hash: ${{ github.sha }}
