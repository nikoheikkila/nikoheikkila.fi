name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CONTRIBUTING.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "CODE_OF_CONDUCT.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          save-cache: "true"

      - name: Lint Code Style
        run: task lint:style

      - name: Run unit tests
        run: task test:unit

  component_tests:
    name: Component Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run component tests
        run: task test:component args='--with-deps --only-shell ${{ matrix.browser }}' -- --browser=${{ matrix.browser }}

  mutation_tests:
    name: Mutation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run mutation tests
        run: task test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          retention-days: 7
          path: reports/mutation/

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore Gatsby build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public
          key: gatsby-public-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gatsby-public-${{ runner.os }}-

      - name: Build site
        id: build
        run: task build

      - name: Type-check
        run: task lint:types

      - name: Bundle preview Worker
        if: github.event_name == 'pull_request'
        run: task site:build

      - name: Upload preview Worker
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-worker
          retention-days: 1
          if-no-files-found: error
          path: infra/site/worker.js

      - name: Upload static assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-assets
          retention-days: 1
          path: |
            public/
            !public/**/*.js.map
            !public/webpack.stats.json
            !public/chunk-map.json

      - name: Upload serve configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: serve-configuration
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/compiled/
            .cache/match-paths.json

      - name: Save Gatsby build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public
          key: gatsby-public-${{ runner.os }}-${{ github.sha }}

  acceptance_tests:
    name: Acceptance Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Download static assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: static-assets
          path: public

      - name: Download serve configuration
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: serve-configuration
          path: .cache

      - name: Run E2E Tests
        run: task test:e2e args='--with-deps ${{ matrix.browser }} ffmpeg' -- --project=${{ matrix.browser }}

  terraform_plan:
    name: Terraform Plan
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    uses: ./.github/workflows/terraform.yml
    with:
      module: cloudflare
      operation: plan
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_STATE_READ_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_SECRET: ${{ secrets.R2_STATE_READ_SECRET }}

  deploy_infrastructure:
    name: Deploy Infrastructure
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: [unit_tests, component_tests, mutation_tests, build, acceptance_tests, terraform_plan]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/terraform.yml
    with:
      module: cloudflare
      operation: deploy
      environment: prod
    # Environment secrets must be passed by name; the called job's
    # `environment` then supplies their values.
    secrets:
      CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_SECRET: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}

  deploy:
    name: Deploy to Production
    needs: [deploy_infrastructure]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/terraform.yml
    with:
      module: site
      operation: deploy
      environment: prod
    # Environment secrets must be passed by name; the called job's
    # `environment` then supplies their values.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_SECRET: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}

  lighthouse:
    name: Lighthouse Audit for Production
    runs-on: ubuntu-latest
    needs: [deploy]
    env:
      LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

    steps:
      - name: Run Audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ needs.deploy.outputs.url }}
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
