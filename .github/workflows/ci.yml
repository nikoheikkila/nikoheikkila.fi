name: CI

on:
  # paths-ignore is deliberately absent from `pull_request`: a skipped workflow
  # never reports its required status checks, which would leave PRs unmergeable.
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CONTRIBUTING.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "CODE_OF_CONDUCT.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    concurrency:
      group: ci-unit-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          save-cache: "true"

      - name: Lint Code Style
        run: task lint:style

      - name: Run unit tests
        run: task test:unit

  component_tests:
    name: Component Tests
    runs-on: ubuntu-latest
    concurrency:
      group: ci-component-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run component tests
        run: task test:component

  acceptance_tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    concurrency:
      group: ci-acceptance-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore Gatsby build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public
          key: gatsby-public-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gatsby-public-${{ runner.os }}-

      - name: Build site
        id: build
        run: task build

      - name: Type-check
        run: task lint:types

      - name: Run E2E Tests
        run: task test:e2e args='--with-deps chromium ffmpeg'

      - name: Upload static assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-assets
          retention-days: 1
          # Webpack does not emit source maps, but gatsby-plugin-offline still
          # copies Workbox's own, and stale ones can survive in a restored public/.
          # Excluding them keeps all of it out of R2, along with build metadata the
          # Worker never serves.
          path: |
            public/
            !public/**/*.js.map
            !public/webpack.stats.json
            !public/chunk-map.json

      - name: Save Gatsby build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public
          key: gatsby-public-${{ runner.os }}-${{ github.sha }}

  deploy-preview:
    name: Deploy to Preview
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: [unit_tests, component_tests, acceptance_tests]
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download static assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.acceptance_tests.outputs.artifact_id }}
          path: public

      - name: Deploy
        id: deploy
        uses: ./.github/actions/terraform-site
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
          workspace: pr-${{ github.event.pull_request.number }}

  lighthouse-preview:
    name: Lighthouse Audit for Preview
    runs-on: ubuntu-latest
    needs: [deploy-preview]
    concurrency:
      group: ci-lighthouse-preview-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

    steps:
      - name: Run Audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ needs.deploy-preview.outputs.deployment-url }}
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    name: Deploy to Production
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: [unit_tests, component_tests, acceptance_tests]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download static assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.acceptance_tests.outputs.artifact_id }}
          path: public

      - name: Deploy
        id: deploy
        uses: ./.github/actions/terraform-site
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
          workspace: default

      - name: Record deployment
        run: echo "[Open production deploy ↗](${{ steps.deploy.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    name: Lighthouse Audit for Production
    runs-on: ubuntu-latest
    needs: [deploy]
    env:
      LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

    steps:
      - name: Run Audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ needs.deploy.outputs.deployment-url }}
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
