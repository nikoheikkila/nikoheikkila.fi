name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CONTRIBUTING.md"
      - "AGENTS.md"
      - "README.md"
      - "CODE_OF_CONDUCT.md"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies
        with:
          save-cache: "true"

      - name: Lint Code Style
        run: task lint:style

      - name: Run unit tests
        run: task test:unit

  workflow_audit:
    name: Audit Workflows
    # Uploading SARIF needs `security-events: write`, which fork and Dependabot
    # pull requests never get.
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Required to check out the repository
      security-events: write # Required to upload SARIF results to Advanced Security

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: auditor
          config: .github/zizmor.yml
          advanced-security: true
          # renovate: datasource=github-tags depName=zizmorcore/zizmor
          version: 1.32.0

      - name: Run jactionlint
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          config-file: .github/actionlint.yml
          profile: pedantic
          online: true
          advanced-security: true

  component_tests:
    name: Component Tests (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies

      - name: Run component tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: task test:component args="--with-deps --only-shell $BROWSER" -- --browser="$BROWSER"

  mutation_tests:
    name: Mutation Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies

      - name: Run mutation tests
        run: task test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          retention-days: 7
          if-no-files-found: error
          path: reports/mutation/

  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies

      - name: Restore Gatsby build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public
          key: gatsby-public-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gatsby-public-${{ runner.os }}-

      - name: Build site
        id: build
        run: task build

      - name: Type-check
        run: task lint:types

      - name: Bundle preview Worker
        if: ${{ github.event_name == 'pull_request' }}
        run: task site:build

      - name: Upload preview Worker
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-worker
          retention-days: 1
          if-no-files-found: error
          path: infra/site/worker.js

      - name: Upload static assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-assets
          retention-days: 1
          if-no-files-found: error
          path: |
            public/
            !public/**/*.js.map
            !public/webpack.stats.json
            !public/chunk-map.json

      - name: Upload serve configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: serve-configuration
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/compiled/
            .cache/match-paths.json

      - name: Save Gatsby build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public
          key: gatsby-public-${{ runner.os }}-${{ github.sha }}

  acceptance_tests:
    name: Acceptance Tests (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Install dependencies
        uses: $/.github/actions/install-dependencies

      - name: Download static assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-assets
          path: public

      - name: Download serve configuration
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: serve-configuration
          path: .cache

      - name: Run E2E Tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: task test:e2e args="--with-deps $BROWSER ffmpeg" -- --project="$BROWSER"

  terraform_plan:
    name: Terraform Plan
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      needs-apply: ${{ steps.terraform.outputs.needs-apply }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      # Read-only repository secrets: the plan runs for pull requests, which the
      # `preview` and `prod` environments never admit.
      - name: Plan infrastructure
        id: terraform
        uses: $/.github/actions/terraform/plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }} # zizmor: ignore[secrets-outside-env]
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_READ_ACCESS_KEY_ID }} # zizmor: ignore[secrets-outside-env]
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_READ_SECRET }} # zizmor: ignore[secrets-outside-env]
        with:
          working-directory: infra/cloudflare
          var-files: ../cloudflare.tfvars
          lock: "false"
          plan-artifact: ${{ github.event_name != 'pull_request' && 'tfplan' || '' }}

  deploy_infrastructure:
    name: Deploy Infrastructure
    if: >-
      ${{ github.event_name != 'pull_request' && github.ref_name == 'main' &&
      needs.terraform_plan.outputs.needs-apply == 'true' }}
    needs: [unit_tests, component_tests, mutation_tests, acceptance_tests, terraform_plan]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read # Required to check out the repository
      actions: read # Required to download artifacts of this run

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      # `cloudflare_workers_custom_domain` only accepts account-wide Workers
      # Scripts Write, so infra/cloudflare uses the broader infra token.
      - name: Deploy infrastructure
        uses: $/.github/actions/terraform/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
        with:
          working-directory: infra/cloudflare
          plan-artifact: tfplan
          emit-outputs: "false"

  deploy:
    name: Deploy to Production
    needs: [deploy_infrastructure]
    # Run even when the infrastructure deploy was skipped (no changes).
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' && github.ref_name == 'main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ steps.site.outputs.url }}
    permissions:
      contents: read # Required to check out the repository
      actions: read # Required to download artifacts of this run
    env:
      # R2 does not implement the AWS flexible checksum extensions.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    outputs:
      url: ${{ steps.site.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup-environment

      - name: Download static assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-assets
          path: ${{ runner.temp }}/site

      - name: Build Worker
        run: task site:build

      - name: Deploy site
        id: terraform
        uses: $/.github/actions/terraform/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
        with:
          working-directory: infra/site
          workspace: default
          var-files: ../cloudflare.tfvars
          vars: dist_dir=${{ runner.temp }}/site
          parallelism: 30

      - name: Read site URL
        id: site
        env:
          OUTPUTS: ${{ steps.terraform.outputs.outputs }}
        run: echo "url=$(jq -r .url <<< "$OUTPUTS")" >> "$GITHUB_OUTPUT"

  lighthouse:
    name: Lighthouse Audit for Production
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [deploy]
    env:
      LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

    steps:
      - name: Run Audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ needs.deploy.outputs.url }}
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
