version: "3"

vars:
  TFPLAN: "tfplan"
  # Infra credentials from the repository root. This module manages the Worker
  # custom domain and the blog-preview Worker, which need the broader infra token.
  OP_ARGS: "--env-file='../../.env.infra'"
  TFVARS: "../cloudflare.tfvars"

tasks:
  format:
    desc: Format Terraform codebase
    cmds:
      - terraform fmt -recursive

  validate:
    desc: Validate Terraform codebase
    cmds:
      - terraform fmt -recursive -check
      - terraform validate

  run:
    desc: Run Terraform commands
    cmd: op run {{ .OP_ARGS }} -- terraform {{ .command }} {{ .CLI_ARGS }}
    requires:
      vars: [command, OP_ARGS]

  init:
    desc: Initialize Terraform (local)
    run: once
    sources:
      - "./**/*.tf"
    generates:
      - .terraform.lock.hcl
    cmds:
      - task: run
        vars:
          command: "init"
      - task: validate

  plan:
    desc: Plan Terraform changes (local)
    deps: [init]
    sources:
      - "./**/*.tf"
      - "./**/*.yml"
      - ".terraform.lock.hcl"
    generates:
      - "{{ .TFPLAN }}"
    cmd:
      task: run
      vars:
        command: "plan -out={{ .TFPLAN }} -var-file={{ .TFVARS }}"

  deploy:
    desc: Apply Terraform changes from plan file (local)
    deps: [plan]
    sources:
      - "{{ .TFPLAN }}"
    cmds:
      - task: run
        vars:
          command: "apply {{ .TFPLAN }}"

  ci:init:
    desc: Initialize Terraform (CI)
    cmds:
      - terraform init
      - task: validate

  ci:plan:
    desc: Plan Terraform changes (CI)
    vars:
      LOCK: '{{ .LOCK | default "true" }}'
    generates:
      - "{{ .TFPLAN }}"
      - plan.txt
    cmds:
      - terraform plan -lock={{ .LOCK }} -out={{ .TFPLAN }} -var-file={{ .TFVARS }}
      - terraform show -no-color {{ .TFPLAN }} > plan.txt

  ci:deploy:
    desc: Apply Terraform changes from plan file (CI)
    cmds:
      - terraform apply {{ .TFPLAN }}
