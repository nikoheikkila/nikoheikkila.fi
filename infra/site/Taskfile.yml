version: "3"

vars:
  TFPLAN: "tfplan"
  WORKSPACE: '{{ .WORKSPACE | default "default" }}'
  # Production credentials from the repository root. Previews are deployed and
  # destroyed only by CI, with the preview environment's blog-preview-scoped token.
  OP_ARGS: "--env-file='../../.env.prod'"
  # Build output to upload; CI points previews at a downloaded artifact outside the checkout.
  DIST_DIR: '{{ .DIST_DIR | default "../../public" }}'
  # The ~700 uploaded objects are tiny independent PUT/HEAD calls that
  # parallelise safely well beyond Terraform's default of 10.
  PARALLELISM: 30
  # Must match preview_worker_name in variables.tf.
  PREVIEW_WORKER_NAME: blog-preview

# R2 does not implement the AWS flexible checksum extensions used by
# recent AWS SDKs, so restrict checksums to where they are required.
env:
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

tasks:
  format:
    desc: Format Terraform codebase
    cmds:
      - terraform fmt -recursive

  validate:
    desc: Validate Terraform codebase
    cmds:
      - terraform fmt -recursive -check
      - terraform validate

  build:
    desc: Compile the Worker script
    sources:
      - worker.ts
      - redirects.json
    generates:
      - worker.js
    cmds:
      - bun build ./worker.ts --outfile ./worker.js

  run:
    desc: Run Terraform commands
    env:
      # The repository variable CI reads too; locally fetched with gh.
      TF_VAR_account_id:
        sh: gh variable get CLOUDFLARE_ACCOUNT_ID
    cmd: op run {{ .OP_ARGS }} -- terraform {{ .command }} {{ .CLI_ARGS }}
    requires:
      vars: [command, OP_ARGS]

  init:
    desc: Initialize Terraform (local)
    run: once
    sources:
      - "./**/*.tf"
    generates:
      - .terraform.lock.hcl
    cmds:
      - task: run
        vars:
          command: "init"
      - task: validate

  plan:
    desc: Plan the site deployment for the given WORKSPACE (local)
    deps: [init, build]
    cmds:
      - task: run
        vars:
          command: "workspace select -or-create=true {{ .WORKSPACE }}"
      - task: run
        vars:
          command: "plan -parallelism={{ .PARALLELISM }} -out={{ .TFPLAN }}"

  deploy:
    desc: Apply the site deployment from plan file (local)
    deps: [plan]
    cmds:
      - task: run
        vars:
          command: "apply -parallelism={{ .PARALLELISM }} {{ .TFPLAN }}"

  ci:preview:deploy:
    desc: Deploy WORKER_DIR/worker.js as Workers Preview WORKSPACE of the preview Worker (CI)
    preconditions:
      - sh: test "{{ .WORKSPACE }}" != "default"
        msg: Production is deployed by Terraform, not as a Workers Preview
      - sh: test -f "{{ .WORKER_DIR }}/worker.js"
        msg: "WORKER_DIR must contain the bundled worker.js"
    requires:
      vars: [WORKER_DIR, HEAD_SHA]
    cmds:
      # The config comes from Terraform state, so the binding is always this
      # workspace's own bucket; --ignore-base-config keeps dashboard settings out.
      # --tag names the pull request commit; the checkout is main.
      - terraform workspace select {{ .WORKSPACE }}
      - terraform output -raw wrangler_config > "{{ .WORKER_DIR }}/wrangler.json"
      - >-
        wrangler preview
        --config "{{ .WORKER_DIR }}/wrangler.json"
        --name {{ .WORKSPACE }}
        --message "Preview for {{ .WORKSPACE }}"
        --tag {{ trunc 7 .HEAD_SHA }}
        --ignore-base-config

  ci:preview:delete:
    desc: Delete the Workers Preview WORKSPACE and all its deployments from the preview Worker, if it exists (CI)
    preconditions:
      - sh: test "{{ .WORKSPACE }}" != "default"
        msg: Production is not a preview
      - sh: test -n "$CLOUDFLARE_ACCOUNT_ID"
        msg: CLOUDFLARE_ACCOUNT_ID must be set, or the existence check skips the delete
    vars:
      PREVIEW: --worker-name {{ .PREVIEW_WORKER_NAME }} --name {{ .WORKSPACE }}
    cmds:
      # Deleting a missing Preview fails: PRs that never deployed have none.
      - cmd: wrangler preview delete {{ .PREVIEW }} --skip-confirmation
        if: wrangler preview secret list {{ .PREVIEW }} --json
