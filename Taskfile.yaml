version: "3"

# Gatsby derives its worker count from *physical* cores, which on an SMT host
# (every GitHub-hosted runner) is half the available parallelism.
env:
  GATSBY_CPU_COUNT: logical_cores

includes:
  terraform:
    taskfile: ./infra/cloudflare/Taskfile.yml
    dir: ./infra/cloudflare

  site:
    taskfile: ./infra/site/Taskfile.yml
    dir: ./infra/site

  ci:
    taskfile: ./.github/Taskfile.yml
    dir: .

  lint:
    taskfile: ./tasks/lint.yaml
    dir: .

  test:
    taskfile: ./tasks/test.yaml
    dir: .

tasks:
  new:
    desc: Scaffold a new post or page
    interactive: true
    cmds:
      - bun run new.ts

  install:
    desc: Install dependencies with Bun
    run: once
    cmd: bun install --frozen-lockfile

  format:
    desc: Format codebase
    deps: [install]
    cmds:
      - bunx biome check --write --unsafe .
      - task: terraform:format

  typegen:
    desc: Generate GraphQL TypeScript types
    deps: [install]
    status:
      - test -f src/gatsby-types.d.ts
    cmds:
      - bun run scripts/generate-types.ts

  lint:
    desc: Lint codebase for style issues
    deps: [lint:style, lint:types]

  test:
    desc: Run application test suite
    deps: [lint]
    cmds:
      - task: test:unit
      - task: test:component
      - task: test:mutation:incremental
      - task: build
      - task: test:e2e

  dev:
    desc: Serve the Gatsby development site
    cmds:
      - bunx gatsby develop

  clean:
    desc: Clear build cache and artifacts
    cmds:
      - bunx gatsby clean
      - rm -f src/gatsby-types.d.ts

  build:
    desc: Build the Gatsby production site
    deps: [install]
    generates:
      - public/
      - .cache/
    env:
      NODE_ENV: production
    cmds:
      - bun run build

  serve:
    desc: Serve the Gatsby production site
    deps: [install]
    env:
      NODE_ENV: production
    cmds:
      - bunx gatsby serve -p 8000
