# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  # Shared Worker hosting every pull request's Workers Preview (pr-<n>).
  PREVIEW_WORKER_NAME: blog-preview

tasks:
  deploy:
    desc: Deploy public/ to production
    cmds:
      # --config skips Wrangler's framework autoconfig, which runs only when no config is given.
      - wrangler deploy --config wrangler.jsonc

  preview:deploy:
    desc: Deploy public/ as Workers Preview pr-<PR_NUMBER> of the shared preview Worker (CI)
    requires:
      vars: [PR_NUMBER, HEAD_SHA]
    preconditions:
      - sh: echo "{{ .PR_NUMBER }}" | grep -Eq '^[1-9][0-9]*$'
        msg: PR_NUMBER must be a pull request number
      - sh: test -f public/index.html
        msg: public/ must hold the built site
    vars:
      PREVIEW_NAME: pr-{{ .PR_NUMBER }}
    cmds:
      - >-
        wrangler preview
        --config wrangler.jsonc
        --worker-name {{ .PREVIEW_WORKER_NAME }}
        --name {{ .PREVIEW_NAME }}
        --message "Preview for {{ .PREVIEW_NAME }}"
        --tag {{ trunc 7 .HEAD_SHA }}
        --ignore-base-config
        --json

  preview:delete:
    desc: Delete the Workers Preview pr-<PR_NUMBER> and its deployments, if it exists (CI)
    requires:
      vars: [PR_NUMBER]
    preconditions:
      - sh: echo "{{ .PR_NUMBER }}" | grep -Eq '^[1-9][0-9]*$'
        msg: PR_NUMBER must be a pull request number
      - sh: test -n "$CLOUDFLARE_ACCOUNT_ID"
        msg: CLOUDFLARE_ACCOUNT_ID must be set, or the existence check skips the delete
    vars:
      PREVIEW: --worker-name {{ .PREVIEW_WORKER_NAME }} --name pr-{{ .PR_NUMBER }}
    cmds:
      # Deleting a missing Preview fails: PRs that never deployed have none.
      - cmd: wrangler preview delete {{ .PREVIEW }} --skip-confirmation
        if: wrangler preview secret list {{ .PREVIEW }} --json

  verify:
    desc: Serve public/ with wrangler dev and check redirects, 404s, caching and methods
    preconditions:
      - sh: test -f public/index.html
        msg: Build the site first with task build
    cmds:
      - |
        set -eu
        port=8787
        base="http://127.0.0.1:$port"
        log="$(mktemp)"
        # Task's shell has no $! or kill builtin, so the dev server is stopped by its command line.
        trap 'pkill -TERM -f "wrangler.js dev --port $port" 2>/dev/null || true; rm -f "$log"' EXIT
        wrangler dev --port "$port" --ip 127.0.0.1 --show-interactive-dev-session=false > "$log" 2>&1 &
        for _ in $(seq 1 60); do curl -fs -o /dev/null "$base/" && break; sleep 1; done

        status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
        header() {
          name="$1"
          shift
          curl -s -o /dev/null -D - "$@" | tr -d '\r' | awk -F': ' -v n="$name" 'tolower($1) == tolower(n) { print $2 }' | tail -1
        }
        fail=0
        assert() {
          if [ "$2" = "$3" ]; then echo "ok    $1: $3"; else echo "FAIL  $1: expected '$2', got '$3'"; fail=1; fi
        }

        assert "/feed status" 301 "$(status "$base/feed")"
        assert "/feed location" /rss.xml "$(header Location "$base/feed")"
        assert "/feed/ status" 301 "$(status "$base/feed/")"
        assert "/feed/ location" /rss.xml "$(header Location "$base/feed/")"
        # The platform answers 307 here; the retired Worker answered 308.
        assert "/about directory redirect" 307 "$(status "$base/about")"
        assert "/about location" /about/ "$(header Location "$base/about")"
        assert "/nope/ status" 404 "$(status "$base/nope/")"
        if curl -s "$base/nope/" | cmp -s - public/404.html; then echo "ok    /nope/ body matches 404.html"; else echo "FAIL  /nope/ body differs from 404.html"; fail=1; fi
        assert "POST / status" 405 "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/")"
        assert "/rss.xml cache-control" no-cache "$(header Cache-Control "$base/rss.xml")"
        js="$(cd public && ls *.js | head -1)"
        assert "/$js cache-control" "public, max-age=31536000, immutable" "$(header Cache-Control "$base/$js")"
        asset="$(cd public && find static -type f | head -1)"
        assert "/$asset cache-control" "public, max-age=31536000, immutable" "$(header Cache-Control "$base/$asset")"
        map="$(cd public && find . -name '*.map' | head -1 | sed 's|^\./||')"
        assert "/webpack.stats.json ignored" 404 "$(status "$base/webpack.stats.json")"
        assert "/$map ignored" 404 "$(status "$base/$map")"

        exit "$fail"
