# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  style:
    desc: Check formatting and lint rules
    deps: [":install"]
    cmds:
      - bunx biome check .

  types:
    desc: Type-check the application and deployment scripts
    deps: [":install", ":typegen"]
    cmds:
      - bunx tsc --noEmit
      - bunx tsc --noEmit --project feature
      - task: site

  site:
    desc: Type-check the site deployment scripts
    internal: true
    sources:
      - infra/site/*.ts
      - infra/site/tsconfig.json
      - infra/site/redirects.json
    cmds:
      - bunx tsc --noEmit --project infra/site

  renovate:
    desc: Lint Renovate configuration
    deps: [":install"]
    sources:
      - renovate.json5
    cmd: bunx renovate-config-validator --strict --no-global renovate.json5

  actions:
    desc: Lint GitHub Actions workflows with Zizmor
    sources:
      - .github/workflows
      - .github/actions
      - .github/zizmor.yml
    env:
      GITHUB_TOKEN:
        sh: gh auth token
    cmds:
      - zizmor --persona=auditor .github/
