# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  style:
    desc: Check formatting and lint rules
    deps: [":install"]
    cmds:
      - bunx biome check .

  types:
    desc: Type-check the application and acceptance tests
    deps: [":install", ":typegen"]
    cmds:
      - bunx tsc --noEmit
      - bunx tsc --noEmit --project feature

  renovate:
    desc: Lint Renovate configuration
    deps: [":install"]
    sources:
      - renovate.json5
    cmd: bunx renovate-config-validator --strict --no-global renovate.json5

  actions:
    desc: Lint GitHub Actions workflows with Zizmor
    sources:
      - .github/workflows
      - .github/actions
      - .github/zizmor.yml
      - .github/actionlint.yml
    cmds:
      - task: actionlint
      - task: zizmor

  actionlint:
    desc: Lint GitHub Actions workflows with jactionlint
    internal: true
    env:
      GITHUB_TOKEN:
        sh: gh auth token
    cmd: >
      jactionlint
      --config-file .github/actionlint.yml
      --format oneline
      --online
      --online-token-env=GITHUB_TOKEN
      --profile pedantic

  zizmor:
    desc: Lint GitHub Actions workflows with Zizmor
    internal: true
    env:
      GITHUB_TOKEN:
        sh: gh auth token
    cmd: zizmor --persona=auditor .github/
