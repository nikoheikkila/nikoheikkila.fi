# Vale configuration: https://docs.vale.sh/topics/.vale.ini
# Run `vale sync` once to download the packages listed below.

StylesPath = .vale/styles
MinAlertLevel = suggestion

# Proper nouns and terms accepted by Vale.Spelling: .vale/styles/config/vocabularies/Blog/accept.txt
Vocab = Blog

# Prose style packages, fetched by `vale sync`.
Packages = proselint, write-good

# Content is written in English; only Markdown under content/ is linted.
[content/**/*.md]
BasedOnStyles = Vale, proselint, write-good

# First-person blog voice with intentional informal phrasing and em dashes.
write-good.E-Prime = NO
write-good.Passive = warning
write-good.TooWordy = warning
write-good.Weasel = warning

# gatsby-remark-smartypants converts quotes, dashes, and '...' at build time.
proselint.Typography = NO

# Skip fenced code blocks, inline code, and raw HTML blocks.
BlockIgnores = (?s) *(<(center|section|script|iframe)[^>]*>.*?</\1>)
TokenIgnores = (<a [^>]*>), (\[\^[^\]]+\]), (https?://\S+)
