# Toolchain for local development (`mise install`) and CI (jdx/mise-action).

[settings]
# mise.lock records checksums and download URLs; Renovate refreshes it with each update.
lockfile = true
locked = false
# CI runners and developer Macs.
lockfile_platforms = ["linux-x64", "macos-arm64"]

[tools]
# Gatsby needs Node.js to build correctly, even though Bun runs everything else.
node = "26.13.1"
bun = "1.4.4"
task = "3.54.0"
terraform = "1.17.2"
vale = "3.27.0"
zizmor = "1.32.0"
jactionlint = "2.6.0"
jq = "1.8.2"
shellcheck = "0.11.0"
ruff = "0.17.5"
gh = "2.104.0"
